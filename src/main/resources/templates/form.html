<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container container--narrow">
    <a class="back-link" th:href="@{/}">&larr; Back to all ratings</a>

    <h1 th:text="${formTitle}">Add a Staff Rating</h1>

    <form th:action="@{${formAction}}" th:object="${rating}" method="post" class="form" novalidate>

        <div class="flash flash--error" th:if="${#fields.hasAnyErrors()}">
            Please fix the highlighted fields below.
        </div>

        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="e.g. Ada Lovelace"/>
            <p class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" placeholder="e.g. ada@sfu.ca"/>
            <p class="field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="roleType">Role</label>
            <select id="roleType" th:field="*{roleType}">
                <option value="">-- Select a role --</option>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role.label}">Professor</option>
            </select>
            <p class="field__error" th:if="${#fields.hasErrors('roleType')}" th:errors="*{roleType}"></p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="clarity">Clarity (1–10)</label>
                <input type="number" id="clarity" th:field="*{clarity}" min="1" max="10"/>
                <p class="field__error" th:if="${#fields.hasErrors('clarity')}" th:errors="*{clarity}"></p>
            </div>

            <div class="field">
                <label for="niceness">Niceness (1–10)</label>
                <input type="number" id="niceness" th:field="*{niceness}" min="1" max="10"/>
                <p class="field__error" th:if="${#fields.hasErrors('niceness')}" th:errors="*{niceness}"></p>
            </div>

            <div class="field">
                <label for="knowledgeableScore">Knowledge (1–10)</label>
                <input type="number" id="knowledgeableScore" th:field="*{knowledgeableScore}" min="1" max="10"/>
                <p class="field__error" th:if="${#fields.hasErrors('knowledgeableScore')}"
                   th:errors="*{knowledgeableScore}"></p>
            </div>
        </div>

        <div class="field">
            <label for="comment">Comment <span class="muted">(optional, max 500 chars)</span></label>
            <textarea id="comment" th:field="*{comment}" rows="4"
                      placeholder="Anything worth noting about this staff member..."></textarea>
            <p class="field__error" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></p>
        </div>

        <div class="form__actions">
            <button type="submit" class="btn btn--primary">Save</button>
            <a class="btn" th:href="@{/}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
