databases:
  - name: rate-cs-staff-db
    databaseName: ratecsstaff
    user: ratecsstaff
    plan: free

services:
  - type: web
    name: rate-cs-staff
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: rate-cs-staff-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: rate-cs-staff-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: rate-cs-staff-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rate-cs-staff-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rate-cs-staff-db
          property: database
